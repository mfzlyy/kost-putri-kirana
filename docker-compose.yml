services:
  db:
    image: postgres:17
    container_name: kpk-postgres
    environment:
      POSTGRES_DB: kost_putri_kirana
      POSTGRES_USER: kpk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - kpk_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpk -d kost_putri_kirana"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kpk_pgdata:
