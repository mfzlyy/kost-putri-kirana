<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Ganti password</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}a{color:#0E5E57}a:hover{color:#0A4842}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.side{flex:1 1 232px;background:#0C3533;color:#B9D6D2;padding:22px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;text-decoration:none}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:8px;color:#B9D6D2;text-decoration:none;font-weight:500}
.nav:hover{background:rgba(220,237,234,.08);color:#fff}
.nav.on{background:#DCEDEA;color:#0C3533;font-weight:650}
.cnt{font-size:13px;padding:1px 8px;border-radius:999px;background:rgba(220,237,234,.14);color:#fff;font-variant-numeric:tabular-nums}
.nav.on .cnt{background:#0C3533;color:#DCEDEA}
.me{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(220,237,234,.16);display:flex;flex-direction:column;gap:2px}
.me a{color:#DCEDEA;font-size:14px}
.main{flex:999 1 560px;min-width:0;padding:40px 48px}
.h1{margin:0;font-size:34px;line-height:1.05;font-weight:750;font-stretch:125%;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:#4D5755}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:8px;font:600 15px 'Archivo',system-ui,sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.bp{background:#0E5E57;color:#fff}.bp:hover{background:#0A4842;color:#fff}
.bq{background:transparent;color:#0E5E57}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.inp{width:100%;height:46px;border:1px solid #CFCBC1;border-radius:8px;padding:0 12px;font:400 16px 'Archivo',system-ui,sans-serif;color:#18211F;background:#fff}
.inp.bad{border-color:#B3261E}
.hint{margin:6px 0 0;font-size:13px;color:#4D5755}.err{margin:6px 0 0;font-size:13px;color:#9E2418}
</style>
</head>
<body>


<div style="display: flex; flex-wrap: wrap; min-height: 800px; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <nav class="side" aria-label="Menu">
    <a class="brand" href="#"><svg width="26" height="31" viewBox="0 0 40 48" role="img" aria-label="Logo Kirana"><rect x="2" y="2" width="36" height="44" rx="9" fill="#DCEDEA"></rect><circle cx="20" cy="9.5" r="3" fill="#0C3533"></circle><path d="M11 17h4.6v21H11z" fill="#0C3533"></path><path d="M15.6 25.2 24.4 16.4H30.8L15.6 31.6z" fill="#0E5E57"></path><path d="M16.8 30.4 20 27.2 30.8 38H24.4z" fill="#0C3533"></path></svg><span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-size: 11px; color: #9FC2BD">Kost Putri</span><span style="font-size: 18px; font-weight: 750; font-stretch: 125%; color: #FFFFFF">Kirana</span></span></a>
    <a class="nav" href="#" aria-current="false">Verifikasi pembayaran<span class="cnt">3</span></a><a class="nav" href="#" aria-current="false">Tagihan</a><a class="nav" href="#" aria-current="false">Kamar</a><a class="nav" href="#" aria-current="false">Penghuni</a><a class="nav" href="#" aria-current="false">Kontrak</a><a class="nav" href="#" aria-current="false">Riwayat transaksi</a><a class="nav" href="#" aria-current="false">Tiket keluhan<span class="cnt">1</span></a><a class="nav" href="#" aria-current="false">Sinkronisasi ERP<span class="cnt">2</span></a><a class="nav" href="#" aria-current="false">Akun pengguna</a><a class="nav" href="#" aria-current="false">Pengaturan</a>
    <div class="me"><span style="color: #FFFFFF; font-weight: 600">[Nama pengelola]</span><span style="font-size: 13px">Pengelola</span><a href="#" style="margin-top: 8px; font-weight: 650; color: #FFFFFF">Ganti password</a><a href="#">Keluar</a></div>
  </nav>
  <main class="main">
    <div style="max-width: 520px; display: flex; flex-direction: column; gap: 24px">
      <div>
        <h1 class="h1">Ganti password</h1>
        <p class="sub">Minimal 8 karakter, berisi huruf dan angka.</p>
      </div>
      <form style="background: #FFFFFF; border: 1px solid #DEDBD3; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <div><label class="lbl" for="a">Password sekarang</label><input class="inp bad" id="a" type="password" value="salahsalah1" aria-invalid="true" aria-describedby="ae"><p class="err" id="ae">Password sekarang tidak cocok.</p></div>
        <div><label class="lbl" for="b">Password baru</label><input class="inp" id="b" type="password" value="kirana2026baru"></div>
        <div><label class="lbl" for="c">Ulangi password baru</label><input class="inp" id="c" type="password" value="kirana2026baru"></div>
        <div style="display: flex; gap: 8px"><button class="btn bp" type="submit">Simpan password</button><a class="btn bq" href="#">Batal</a></div>
      </form>
    </div>
  </main>
</div>




</body></html>
