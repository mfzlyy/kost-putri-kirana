<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Ajukan keluhan</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}
a{color:#0E5E57}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #CFCBC1;border-radius:8px;overflow:hidden;background:#fff}
.seg label{display:flex;align-items:center;justify-content:center;height:48px;font-weight:600;cursor:pointer;border-left:1px solid #CFCBC1}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{background:#18211F;color:#fff}
.chip{height:40px;padding:0 14px;border-radius:8px;border:1px solid #CFCBC1;background:#fff;font:550 15px 'Archivo',system-ui,sans-serif;color:#18211F;cursor:pointer}
.chip.on{border:2px solid #0E5E57;background:#DCEDEA;color:#0C3533;font-weight:650}
textarea{width:100%;min-height:120px;border:1px solid #B3261E;border-radius:8px;padding:12px;font:400 16px/1.5 'Archivo',system-ui,sans-serif;color:#18211F;background:#fff;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:8px;border:0;font:600 15px 'Archivo',system-ui,sans-serif;background:#0E5E57;color:#fff;cursor:pointer}
</style>
</head>
<body>


<div style="position: relative; width: 360px; height: 860px; overflow: hidden; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E7E4DD; background: #FFFFFF">
    <a href="#" aria-label="Kembali ke keluhan" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18211F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 650">Ajukan keluhan</h1>
  </header>
  <form novalidate="" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend class="lbl" style="padding: 0">Lokasi</legend>
      <div class="seg"><label class="on"><input type="radio" name="l" checked="">Kamar 05</label><label><input type="radio" name="l">Area bersama</label></div>
    </fieldset>
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend class="lbl" style="padding: 0">Fasilitas yang rusak</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="chip on" type="button" aria-pressed="true">Kipas angin</button><button class="chip" type="button" aria-pressed="false">Lampu kamar</button><button class="chip" type="button" aria-pressed="false">Kran wastafel</button><button class="chip" type="button" aria-pressed="false">Kasur</button><button class="chip" type="button" aria-pressed="false">Lemari</button>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #4D5755">Daftar mengikuti fasilitas di lokasi yang dipilih.</p>
    </fieldset>
    <div>
      <label class="lbl" for="ds">Ceritakan kerusakannya</label>
      <textarea id="ds" aria-invalid="true" aria-describedby="dse" placeholder="Contoh: berputar pelan lalu mati setelah beberapa menit"></textarea>
      <p id="dse" style="margin: 6px 0 0; font-size: 13px; color: #9E2418">Deskripsi wajib diisi agar vendor tahu apa yang perlu dibawa.</p>
    </div>
    <button class="btn" type="submit">Kirim keluhan</button>
    <p style="margin: -12px 0 0; font-size: 13px; color: #4D5755; text-align: center">Nomor tiket muncul setelah terkirim.</p>
  </form>
</div>




</body></html>
