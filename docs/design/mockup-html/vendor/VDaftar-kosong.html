<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<title>Permintaan kerja</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}
a{color:#0E5E57}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.prog{display:inline-flex;gap:3px}
.prog i{display:block;width:14px;height:5px;border-radius:2px;background:#DEDBD3}
.prog i.f{background:#0E5E57}
.card{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #DEDBD3;border-radius:16px;padding:16px;text-decoration:none;color:#18211F}
.kd{font-variant-numeric:tabular-nums;font-size:13px;color:#4D5755}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:8px;border:0;font:600 15px 'Archivo',system-ui,sans-serif;cursor:pointer;margin-top:4px}
.bp{background:#0E5E57;color:#fff}.bs{background:#fff;color:#18211F;border:1px solid #CFCBC1}
.h2{margin:6px 2px 0;font-size:15px;font-weight:650;color:#4D5755}
</style>
</head>
<body>


<div style="position: relative; width: 360px; height: 860px; overflow: hidden; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="padding: 18px 16px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E7E4DD; background: #FFFFFF">
    <svg width="24" height="29" viewBox="0 0 40 48" role="img" aria-label="Kost Putri Kirana"><rect x="2" y="2" width="36" height="44" rx="9" fill="#0C3533"></rect><circle cx="20" cy="9.5" r="3" fill="#F6F5F1"></circle><path d="M11 17h4.6v21H11z" fill="#F6F5F1"></path><path d="M15.6 25.2 24.4 16.4H30.8L15.6 31.6z" fill="#7CC6BA"></path><path d="M16.8 30.4 20 27.2 30.8 38H24.4z" fill="#F6F5F1"></path></svg>
    <div style="line-height: 1.2; flex: 1"><div style="font-weight: 650; font-size: 17px">Permintaan kerja</div><div style="font-size: 13px; color: #4D5755">Pak Rudi Servis</div></div>
    <a href="#" style="font-weight: 600; font-size: 14px; padding: 10px 4px">Keluar</a>
  </header>
  
  
    <main style="padding: 72px 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <svg width="64" height="76" viewBox="0 0 40 48" aria-hidden="true"><rect x="2" y="2" width="36" height="44" rx="9" fill="none" stroke="#CFCBC1" stroke-width="1.5" stroke-dasharray="3 3"></rect><circle cx="20" cy="9.5" r="3" fill="none" stroke="#CFCBC1" stroke-width="1.5"></circle></svg>
      <h2 style="margin: 8px 0 0; font-size: 20px; font-weight: 750; font-stretch: 125%">Belum ada pekerjaan</h2>
      <p style="margin: 0; color: #4D5755; max-width: 26ch">Pekerjaan baru muncul di sini setelah pengelola menugaskannya kepada Anda.</p>
    </main>
  
</div>




</body></html>
