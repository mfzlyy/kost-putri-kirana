<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu ponsel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}a{color:#0E5E57}a:hover{color:#0A4842}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.st svg{width:14px;height:14px;flex:none}
.s-ok{color:#1D6532}.s-wait{color:#714A00}.s-none{color:#474D4B}.s-late{color:#9E2418}
.prog{display:inline-flex;gap:3px;vertical-align:middle}.prog i{display:block;width:14px;height:5px;border-radius:2px;background:#DEDBD3}.prog i.f{background:#0E5E57}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:8px;font:600 15px 'Archivo',system-ui,sans-serif;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.bp{background:#0E5E57;color:#fff}.bp:hover{background:#0A4842;color:#fff}
.bs{background:#fff;color:#18211F;border-color:#CFCBC1}.bq{background:transparent;color:#0E5E57}
.bd{background:#fff;color:#9E2418;border-color:#E3B4AD}
.full{width:100%}
.lk{background:none;border:0;padding:8px 4px;font:600 14px 'Archivo',system-ui,sans-serif;color:#0E5E57;cursor:pointer;min-height:40px;text-decoration:none}
.lk.dg{color:#9E2418}
.fl{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid #CFCBC1;background:#fff;color:#18211F;font:550 14px 'Archivo',system-ui,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.fl.on{background:#18211F;border-color:#18211F;color:#fff}
.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.inp{width:100%;height:48px;border:1px solid #CFCBC1;border-radius:8px;padding:0 12px;font:400 16px 'Archivo',system-ui,sans-serif;color:#18211F;background:#fff}
.inp.bad{border-color:#B3261E}
.hint{margin:6px 0 0;font-size:13px;color:#4D5755}.err{margin:6px 0 0;font-size:13px;color:#9E2418}
.box{background:#fff;border:1px solid #DEDBD3;border-radius:16px}
.list{background:#fff;border:1px solid #DEDBD3;border-radius:16px;overflow:hidden;list-style:none;margin:0;padding:0}
.it{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-top:1px solid #EFEDE8}
.it:first-child{border-top:0}
.r2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.num{font-variant-numeric:tabular-nums}.mut{color:#4D5755}.sm{font-size:14px}
.kd{font-variant-numeric:tabular-nums;font-size:13px;color:#4D5755}
.rm{font-size:20px;line-height:1;font-weight:750;font-stretch:125%;font-variant-numeric:tabular-nums}
.tag{position:relative;padding:20px 8px 8px;border-radius:10px;border:1px solid #DEDBD3;background:#fff;text-align:left;font:inherit;color:#18211F;display:flex;flex-direction:column;gap:2px;min-height:78px}
.tag::before{content:"";position:absolute;top:7px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:999px;border:1px solid #DEDBD3;background:#F6F5F1}
.tag.off{background:#F1EFE9;color:#6A716F}
.tag.sel{border:2px solid #0E5E57;background:#DCEDEA}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
dl.dd{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;font-size:15px}
dl.dd dt{color:#4D5755}dl.dd dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px 20px;font-size:14px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:8px;height:8px;border-radius:999px;background:#0E5E57}
.tl li::after{content:"";position:absolute;left:6.5px;top:15px;bottom:0;width:1px;background:#CFCBC1}
.tl li:last-child{padding-bottom:0}.tl li:last-child::after{display:none}
.tl li.nx::before{background:#fff;border:1.5px solid #8A918F}
.bar{height:56px;background:#0C3533;display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;color:#DCEDEA}
.mb{width:44px;height:44px;border:0;background:none;color:#DCEDEA;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.wrap{padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
.h1{margin:0;font-size:26px;line-height:1.1;font-weight:750;font-stretch:125%;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:#4D5755;font-size:14px}
.sec{margin:4px 0 -4px;font-size:16px;font-weight:650}
.hdr{height:56px;padding:0 8px;display:flex;align-items:center;gap:4px;border-bottom:1px solid #E7E4DD;background:#fff}
.hdr a,.hdr button.x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#18211F;border:0;background:none;cursor:pointer}
.hdr h1{margin:0;font-size:17px;font-weight:650}
.mi{color:#B9D6D2;font-weight:500}.mi.on{background:#DCEDEA;color:#0C3533 !important;font-weight:650}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 780px; overflow: hidden; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <div aria-hidden="true"><div class="bar"></div><div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 12px"><div class="box" style="height: 90px"></div><div class="box" style="height: 300px"></div></div></div>
  <div style="position: absolute; inset: 0; background: rgba(12, 53, 51, .55)"></div>
  <nav aria-label="Menu" style="position: absolute; top: 0; bottom: 0; left: 0; width: 288px; background: #0C3533; color: #B9D6D2; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 18px 8px"><span style="display: flex; align-items: center; gap: 10px"><svg width="24" height="29" viewBox="0 0 40 48" role="img" aria-label="Logo Kirana"><rect x="2" y="2" width="36" height="44" rx="9" fill="#DCEDEA"></rect><circle cx="20" cy="9.5" r="3" fill="#0C3533"></circle><path d="M11 17h4.6v21H11z" fill="#0C3533"></path><path d="M15.6 25.2 24.4 16.4H30.8L15.6 31.6z" fill="#0E5E57"></path><path d="M16.8 30.4 20 27.2 30.8 38H24.4z" fill="#0C3533"></path></svg><span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-size: 11px; color: #9FC2BD">Kost Putri</span><span style="font-size: 17px; font-weight: 750; font-stretch: 125%; color: #FFFFFF">Kirana</span></span></span><button type="button" aria-label="Tutup menu" style="width: 44px; height: 44px; border: 0; background: none; color: #DCEDEA; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="10"><a href="#" class="{{m.cls}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none">{{m.label}}<sc-if value="{{m.count}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; padding: 1px 8px; border-radius: 999px; background: rgba(220,237,234,.14); color: #fff">{{m.count}}</span></sc-if></a></sc-for>
    <div style="margin-top: auto; padding: 14px 12px 0; border-top: 1px solid rgba(220,237,234,.16); display: flex; flex-direction: column; gap: 4px"><span style="color: #FFFFFF; font-weight: 600">{{nama}}</span><span style="font-size: 13px">{{peranLabel}}</span><a href="#" style="color: #DCEDEA; font-size: 14px; margin-top: 6px">Ganti password</a><a href="#" style="color: #DCEDEA; font-size: 14px">Keluar</a></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"peran": {"editor": "enum", "options": ["pengelola", "pemilik"], "default": "pengelola"}, "$preview": {"width": 360, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    const kelola = (this.props.peran ?? 'pengelola') === 'pengelola';
    const P = [['Verifikasi pembayaran', 3], ['Tagihan', 0], ['Kamar', 0], ['Penghuni', 0], ['Kontrak', 0], ['Riwayat transaksi', 0], ['Tiket keluhan', 1], ['Sinkronisasi ERP', 2], ['Akun pengguna', 0], ['Pengaturan', 0]];
    const O = [['Dashboard', 0], ['Kamar', 0], ['Penghuni', 0], ['Kontrak', 0], ['Tagihan', 0], ['Riwayat transaksi', 0], ['Tiket keluhan', 1], ['Pengaturan', 0]];
    const aktif = kelola ? 'Tagihan' : 'Dashboard';
    const menu = (kelola ? P : O).map(([label, count]) => ({ label, count: count || '', cls: label === aktif ? 'mi on' : 'mi' }));
    return { menu, nama: kelola ? '[Nama pengelola]' : '[Nama pemilik]', peranLabel: kelola ? 'Pengelola' : 'Pemilik' };
  }
}
</script>
</body>
</html>
