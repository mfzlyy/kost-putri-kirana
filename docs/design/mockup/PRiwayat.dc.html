<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Riwayat pembayaran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}
a{color:#0E5E57}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:14px 16px;border-top:1px solid #E7E4DD}
.it:first-child{border-top:0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:550;color:#4D5755;text-decoration:none}
.tab.on{color:#0E5E57}
.btn{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;font:600 15px 'Archivo',system-ui,sans-serif;background:#fff;color:#18211F;border:1px solid #CFCBC1;width:100%;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 860px; overflow: hidden; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="padding: 18px 16px 14px">
    <h1 style="margin: 0; font-size: 26px; line-height: 1.1; font-weight: 750; font-stretch: 125%">Riwayat</h1>
    <p style="margin: 4px 0 0; font-size: 14px; color: #4D5755">Pembayaran yang sudah diterima pengelola.</p>
  </header>
  <main style="padding: 0 16px 96px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
      <span style="color: #4D5755; font-size: 14px">Sejak Februari 2026</span>
      <span class="num" style="font-weight: 650">8 kali, Rp11.200.000</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #DEDBD3; border-radius: 16px; overflow: hidden">
      <sc-for list="{{baris}}" as="b" hint-placeholder-count="5">
        <li class="it">
          <span style="font-weight: 600">{{b.bulan}}</span>
          <span class="num" style="font-weight: 600">Rp1.400.000</span>
          <span style="font-size: 14px; color: #4D5755">Dibayar {{b.bayar}}, diterima {{b.terima}}</span>
          <svg width="14" height="14" viewBox="0 0 16 16" role="img" aria-label="Lunas" style="color: #1D6532; justify-self: end; align-self: center"><circle cx="8" cy="8" r="7" fill="currentColor"></circle><path d="M4.8 8.2l2.1 2.1 4.3-4.6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </li>
      </sc-for>
    </ul>
    <button class="btn" type="button">Tampilkan 3 lagi</button>
  </main>
  <nav aria-label="Menu penghuni" style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; background: #FFFFFF; border-top: 1px solid #DEDBD3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a class="tab" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Tagihan</a>
    <a class="tab on" href="#" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Riwayat</a>
    <a class="tab" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"></path></svg>Keluhan</a>
    <a class="tab" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const baris = [
      { bulan: 'September 2026', bayar: '8 Sep', terima: '8 Sep' },
      { bulan: 'Agustus 2026', bayar: '6 Agu', terima: '7 Agu' },
      { bulan: 'Juli 2026', bayar: '9 Jul', terima: '9 Jul' },
      { bulan: 'Juni 2026', bayar: '5 Jun', terima: '5 Jun' },
      { bulan: 'Mei 2026', bayar: '10 Mei', terima: '11 Mei' }
    ];
    return { baris };
  }
}
</script>
</body>
</html>
