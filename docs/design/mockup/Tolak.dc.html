<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dialog tolak bukti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1}*{box-sizing:border-box}:focus-visible{outline:2px solid #0E5E57;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:8px;font:600 15px 'Archivo',system-ui,sans-serif;border:1px solid transparent;cursor:pointer}
.bq{background:transparent;color:#0E5E57}
.bdf{background:#9E2418;color:#fff}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;border:1px solid #CFCBC1;background:#fff;font:500 14px 'Archivo',system-ui,sans-serif;color:#18211F;cursor:pointer}
.g{background:#E9E7E1;border-radius:10px}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #F6F5F1; color: #18211F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <div aria-hidden="true" style="display: flex; height: 100%">
    <div style="width: 232px; background: #0C3533"></div>
    <div style="flex: 1; padding: 40px 48px; display: flex; flex-direction: column; gap: 24px">
      <div class="g" style="height: 36px; width: 380px"></div>
      <div style="display: flex; gap: 24px; flex: 1"><div class="g" style="flex: 1; max-height: 260px; border-radius: 16px"></div><div class="g" style="flex: 1.4; max-height: 560px; border-radius: 16px"></div></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(12,53,51,0.55); display: flex; align-items: center; justify-content: center; padding: 20px">
    <form role="dialog" aria-modal="true" aria-labelledby="dt" style="width: 100%; max-width: 500px; background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 18px 40px rgba(12,53,51,0.22)">
      <div>
        <h2 id="dt" style="margin: 0; font-size: 22px; line-height: 1.15; font-weight: 700; font-stretch: 125%">Tolak bukti Kamar 02?</h2>
        <p style="margin: 8px 0 0; color: #4D5755">Tagihan November kembali ke Belum bayar. Rina akan melihat alasan ini dan bisa mengunggah bukti baru.</p>
      </div>
      <div>
        <label for="al" style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px">Alasan penolakan</label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px" role="group" aria-label="Alasan cepat">
          <button class="chip" type="button">Nominal tidak sesuai</button>
          <button class="chip" type="button">Foto tidak terbaca</button>
          <button class="chip" type="button">Bukan untuk tagihan ini</button>
        </div>
        <textarea id="al" rows="3" style="width: 100%; min-height: 96px; border: 1px solid #CFCBC1; border-radius: 8px; padding: 12px; font: 400 16px 'Archivo', system-ui, sans-serif; color: #18211F; resize: vertical">Nominal transfer Rp1.200.000, kurang Rp50.000 dari tagihan.</textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button class="btn bq" type="button">Batal</button>
        <button class="btn bdf" type="submit">Tolak bukti</button>
      </div>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
